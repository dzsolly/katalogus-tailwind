<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Katalógus</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="max-w-6xl mx-auto p-6">

    <!-- Cím -->
    <h1 class="text-3xl font-bold mb-6 text-center">
      Katalógus
    </h1>

    <!-- Kereső -->
    <input 
      type="text" 
      id="search"
      placeholder="Keresés..." 
      class="w-full p-3 mb-6 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
      onkeyup="filterItems()"
    >

    <!-- Lista -->
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- ITEM -->
      <div class="item bg-white rounded-2xl shadow-md p-4 hover:shadow-lg transition">
        <h2 class="text-lg font-semibold">Termék 1</h2>
        <p class="text-gray-500">Leírás 1</p>
      </div>

      <div class="item bg-white rounded-2xl shadow-md p-4 hover:shadow-lg transition">
        <h2 class="text-lg font-semibold">Termék 2</h2>
        <p class="text-gray-500">Leírás 2</p>
      </div>

      <div class="item bg-white rounded-2xl shadow-md p-4 hover:shadow-lg transition">
        <h2 class="text-lg font-semibold">Termék 3</h2>
        <p class="text-gray-500">Leírás 3</p>
      </div>

    </div>

  </div>

  <!-- Kereső logika -->
  <script>
    function filterItems() {
      let input = document.getElementById("search").value.toLowerCase();
      let items = document.getElementsByClassName("item");

      for (let i = 0; i < items.length; i++) {
        let text = items[i].innerText.toLowerCase();
        items[i].style.display = text.includes(input) ? "" : "none";
      }
    }
  </script>

</body>
</html>
