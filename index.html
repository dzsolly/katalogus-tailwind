<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Katalógus</title>

  <!-- ✅ Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-6xl mx-auto px-4 py-6">

  <h1 class="text-3xl font-bold text-center mb-6">🚀 Katalógus</h1>

  <!-- SEARCH -->
  <input id="search"
    placeholder="Keresés..."
    onkeyup="renderItems()"
    class="w-full p-3 mb-4 border rounded-2xl">

  <!-- ✅ AUTO FILTER -->
  <div id="filters"
       class="flex flex-wrap gap-2 mb-6 justify-center"></div>

  <!-- GRID -->
  <div id="list"
       class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"></div>

</div>

<script>

/* ✅ DATA */
let data = [
  {
    name: "Laptop",
    desc: "Gyors és modern",
    category: "tech",
    image: "https://picsum.photos/400"
  },
  {
    name: "Telefon",
    desc: "Okos és kompakt",
    category: "tech",
    image: "https://picsum.photos/401"
  },
  {
    name: "Autó",
    desc: "Gyors és kényelmes",
    category: "auto",
    image: "https://picsum.photos/402"
  },
  {
    name: "Szék",
    desc: "Kényelmes ülés",
    category: "butor",
    image: "https://picsum.photos/403"
  }
];

let currentCategory = "all";

/* ✅ KATEGÓRIAK KINYERÉSE */
function getCategories() {
  const cats = data.map(item => item.category);
  return ["all", ...new Set(cats)];
}

/* ✅ FILTER GOMBOK GENERÁLÁSA */
function renderFilters() {
  const container = document.getElementById("filters");
  container.innerHTML = "";

  getCategories().forEach(cat => {
    container.innerHTML += `
      <button onclick="setCategory('${cat}', event)"
        class="btn px-4 py-2 rounded-xl transition ${
          cat === "all"
            ? "bg-blue-500 text-white"
            : "bg-gray-200"
        }">
        ${cat}
      </button>
    `;
  });
}

/* ✅ RENDER */
function renderItems() {
  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML = "";

  data.forEach(item => {
    if (
      (currentCategory === "all" || item.category === currentCategory) &&
      (item.name.toLowerCase().includes(search) ||
       item.desc.toLowerCase().includes(search))
    ) {
      list.innerHTML += `
        <div class="bg-white rounded-2xl shadow p-4">

          <img src="${item.image}"
               class="w-full h-40 object-cover rounded-lg mbm">${item.desc}</p>

        </div>
      `;
    }
  });
}

/* ✅ CATEGORY SELECT */
function setCategory(cat, e) {
  currentCategory = cat;

  document.querySelectorAll(".btn").forEach(b => {
    b.classList.remove("bg-blue-500","text-white");
    b.classList.add("bg-gray-200");
  });

  e.target.classList.add("bg-blue-500","text-white");

  renderItems();
}

/* ✅ INIT */
renderFilters();
renderItems();

</script>

</body>
</html>
