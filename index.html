<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalógus PRO</title>

  https://cdn.tailwindcss.com
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-6">

  <h1 class="text-3xl font-bold text-center mb-6">🚀 Katalógus</h1>

  <!-- SEARCH -->
  <input id="search" onkeyup="renderItems()"
    placeholder="Keresés..."
    class="w-full p-3 mb-4 border rounded-2xl">

  <!-- FILTER -->
  <div class="flex flex-wrap gap-2 mb-6 justify-center">
    <button onclick="setCategory('all', event)" class="btn bg-blue-500 text-white px-4 py-2 rounded-xl">Összes</button>
    <button onclick="setCategory('tech', event)" class="btn bg-gray-200 px-4 py-2 rounded-xl">Tech</button>
    <button onclick="setCategory('auto', event)" class="btn bg-gray-200 px-4 py-2 rounded-xl">Autó</button>
  </div>

  <!-- ADMIN PANEL -->
  <div class="bg-white p-4 rounded-2xl shadow mb-6">
    <h2 class="font-bold mb-3">➕ Új elem hozzáadása</h2>

    <input id="name" placeholder="Név" class="w-full p-2 mb-2 border rounded">
    <input id="desc" placeholder="Leírás" class="w-full p-2 mb-2 border rounded">
    <input id="category" placeholder="Kategória (pl tech)" class="w-full p-2 mb-2 border rounded">
    <input id="image" placeholder="Kép URL" class="w-full p-2 mb-2 border rounded">

    <button onclick="addItem()"
      class="bg-green-500 text-white px-4 py-2 rounded-xl w-full">
      Hozzáadás
    </button>
  </div>

  <!-- GRID -->
  <div id="list" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("data")) || [
  {
    name: "Laptop",
    desc: "Gyors eszköz",
    category: "tech",
    image: "https://via.placeholder.com/400"
  },
  {
    name: "Autó",
    desc: "Gyors jármű",
    category: "auto",
    image: "https://via.placeholder.com/400"
  }
];

let currentCategory = "all";

/* ✅ RENDER */
function renderItems() {
  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML = "";

  data.forEach(item => {
    if (
      (currentCategory === "all" || item.category === currentCategory) &&
      (item.name.toLowerCase().includes(search) ||
       item.desc.toLowerCase().includes(search))
    ) {
      list.innerHTML += `
        <div class="bg-white rounded-2xl shadow hover:shadow-xl transition">

          ${item.image}

          <div class="p-4">
            <h2 class="font-semibold">${item.name}</h2>
            <p class="text-gray-500 text-sm">${item.desc}</p>
          </div>

        </div>
      `;
    }
  });
}

/* ✅ ADD ITEM */
function addItem() {
  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;
  const category = document.getElementById("category").value;
  const image = document.getElementById("image").value;

  if (!name || !desc || !category || !image) {
    alert("Tölts ki mindent!");
    return;
  }

  data.push({ name, desc, category, image });

  localStorage.setItem("data", JSON.stringify(data));

  renderItems();
}

/* ✅ CATEGORY */
function setCategory(cat, e) {
  currentCategory = cat;

  document.querySelectorAll(".btn").forEach(b => {
    b.classList.remove("bg-blue-500","text-white");
    b.classList.add("bg-gray-200");
  });

  e.target.classList.add("bg-blue-500","text-white");

  renderItems();
}

renderItems();

</script>

</body>
</html>
