<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Katalógus Ultra</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto p-6">

  <!-- HEADER -->
  <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
    🚀 Katalógus
  </h1>

  <!-- SEARCH -->
  <input
    id="search"
    type="text"
    placeholder="Keresés..."
    onkeyup="filterItems()"
    class="w-full p-4 mb-6 border border-gray-300 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
  >

  <!-- FILTER BUTTONS -->
  <div class="flex gap-3 mb-8 flex-wrap justify-center">
    <button onclick="filterCategory('all')" class="filter-btn bg-blue-500 text-white px-4 py-2 rounded-xl">Összes</button>
    <button onclick="filterCategory('tech')" class="filter-btn bg-gray-200 px-4 py-2 rounded-xl">Tech</button>
    <button onclick="filterCategory('auto')" class="filter-btn bg-gray-200 px-4 py-2 rounded-xl">Autó</button>
    <button onclick="filterCategory('egyeb')" class="filter-btn bg-gray-200 px-4 py-2 rounded-xl">Egyéb</button>
  </div>

  <!-- GRID -->
  <div id="list" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

    <!-- ITEM -->
    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300" data-category="tech">
      <img src="https://via.placeholder.com/400" class="w-full h-40 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold">Laptop</h2>
        <p class="text-gray-500 text-sm">Gyors és modern eszköz</p>
      </div>
    </div>

    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300" data-category="auto">
      <img src="https://via.placeholder.com/400" class="w-full h-40 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold">Autó</h2>
        <p class="text-gray-500 text-sm">Kényelmes és gyors</p>
      </div>
    </div>

    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300" data-category="egyeb">
      <img src="https://via.placeholder.com/400" class="w-full h-40 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold">Szék</h2>
        <p class="text-gray-500 text-sm">Kényelmes ülés</p>
      </div>
    </div>

  </div>

</div>

<!-- SCRIPT -->
<script>
let currentCategory = "all";

function filterItems() {
  let input = document.getElementById("search").value.toLowerCase();
  let items = document.querySelectorAll(".item");

  items.forEach(item => {
    let text = item.innerText.toLowerCase();
    let category = item.dataset.category;

    let matchText = text.includes(input);
    let matchCategory = currentCategory === "all" || category === currentCategory;

    item.style.display = (matchText && matchCategory) ? "" : "none";
  });
}

function filterCategory(category) {
  currentCategory = category;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("bg-blue-500","text-white");
    btn.classList.add("bg-gray-200");
  });

  event.target.classList.add("bg-blue-500","text-white");

  filterItems();
}
</script>

</body>
</html>
