<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Katalógus Ultra</title>

  <!-- ✅ JAVÍTVA: helyes Tailwind betöltés -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-6">

  <!-- HEADER -->
  <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-center text-gray-800 mb-6 sm:mb-8">
    🚀 Katalógus
  </h1>

  <!-- SEARCH -->
  <input
    id="search"
    type="text"
    placeholder="Keresés..."
    onkeyup="filterItems()"
    class="w-full p-3 sm:p-4 mb-4 sm:mb-6 border border-gray-300 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
  >

  <!-- FILTER -->
  <div class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-6 sm:mb-8">
    <button onclick="filterCategory('all', event)" class="filter-btn bg-blue-500 text-white px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base">Összes</button>
    <button onclick="filterCategory('tech', event)" class="filter-btn bg-gray-200 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base">Tech</button>
    <button onclick="filterCategory('auto', event)" class="filter-btn bg-gray-200 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base">Autó</button>
    <button onclick="filterCategory('egyeb', event)" class="filter-btn bg-gray-200 px-3 sm:px-4 py-2 rounded-xl text-sm sm:text-base">Egyéb</button>
  </div>

  <!-- GRID -->
  <div id="list" class="grid gap-4 sm:gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">

    <!-- ITEM -->
    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300"
         data-category="tech">
      <img src="https://via.placeholder.com/400" class="w-full h-40 sm:h-48 object-cover">
      <div class="p-4">
        <h2 class="text-base sm:text-lg font-semibold">Laptop</h2>
        <p class="text-gray-500 text-sm">Gyors és modern eszköz</p>
      </div>
    </div>

    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300"
         data-category="auto">
      <img src="https://via.placeholder.com/400" class="w-full h-40 sm:h-48 object-cover">
      <div class="p-4">
        <h2 class="text-base sm:text-lg font-semibold">Autó</h2>
        <p class="text-gray-500 text-sm">Kényelmes és gyors</p>
      </div>
    </div>

    <div class="item bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300"
         data-category="egyeb">
      <img src="https://via.placeholder.com/400" class="w-full h-40 sm:h-48 object-cover">
      <div class="p-4">
        <h2 class="text-base sm:text-lg font-semibold">Szék</h2>
        <p class="text-gray-500 text-sm">Kényelmes ülés</p>
      </div>
    </div>

  </div>

</div>

<!-- SCRIPT -->
<script>
let currentCategory = "all";

function filterItems() {
  const input = document.getElementById("search").value.toLowerCase();
  const items = document.querySelectorAll(".item");

  items.forEach(item => {
    const text = item.innerText.toLowerCase();
    const category = item.dataset.category;

    const matchText = text.includes(input);
    const matchCategory = currentCategory === "all" || category === currentCategory;

    item.style.display = (matchText && matchCategory) ? "" : "none";
  });
}

function filterCategory(category, event) {
  currentCategory = category;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("bg-blue-500","text-white");
    btn.classList.add("bg-gray-200");
  });

  event.target.classList.add("bg-blue-500","text-white");

  filterItems();
}
</script>

</body>
</html>
